[package]
name = "tik"
version = "0.1.3"
edition = "2024"
rust-version = "1.95"
description = "Count LLM tokens in text files"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.0"
tiktoken = "3.1.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
